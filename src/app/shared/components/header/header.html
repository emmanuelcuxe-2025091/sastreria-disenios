<header class="site-header">
  <div class="container header-inner">
    <a class="brand" routerLink="/" (click)="closeMenu()" aria-label="Sastrería y Diseños — Inicio">
      <span class="brand-monogram" aria-hidden="true">SD</span>
      <span class="brand-copy">
        <span class="brand-name">{{ env.company.name }}</span>
        <span class="brand-est">Desde {{ env.company.foundedYear }}</span>
      </span>
    </a>

    <nav class="desktop-nav" aria-label="Navegación principal">
      @for (item of navItems; track item.path) {
        <a
          class="nav-link"
          [routerLink]="item.path"
          routerLinkActive="is-active"
          [routerLinkActiveOptions]="{ exact: item.exact }"
        >
          {{ item.label }}
        </a>
      }
    </nav>

    <div class="header-actions">
      <a class="header-cta" routerLink="/catalogo" (click)="closeMenu()">
        Explorar archivo
      </a>

      <button
        type="button"
        class="menu-toggle"
        [attr.aria-expanded]="menuOpen()"
        aria-controls="mobile-nav"
        aria-label="Abrir menú de navegación"
        (click)="toggleMenu()"
      >
        <span class="menu-bar" [class.open]="menuOpen()"></span>
        <span class="menu-bar" [class.open]="menuOpen()"></span>
      </button>
    </div>
  </div>

  @if (menuOpen()) {
    <nav id="mobile-nav" class="mobile-nav" aria-label="Navegación móvil">
      <div class="container mobile-nav-inner">
        @for (item of navItems; track item.path) {
          <a
            class="mobile-nav-link"
            [routerLink]="item.path"
            routerLinkActive="is-active"
            [routerLinkActiveOptions]="{ exact: item.exact }"
            (click)="closeMenu()"
          >
            {{ item.label }}
          </a>
        }
        <a class="mobile-nav-meta" [href]="'mailto:' + env.company.email">
          {{ env.company.email }}
        </a>
      </div>
    </nav>
  }
</header>
